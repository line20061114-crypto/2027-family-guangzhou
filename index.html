<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b2447">
<title>광저우 가족여행 2027</title>
<style>
:root{
  --bg:#f2f5f8;--card:#fff;--ink:#14202b;--sub:#5b6a78;--pri:#0b3a5b;--pri2:#1a6a9c;
  --acc:#e8512f;--accbg:#fff1ec;--line:#e2e8ee;--on:#fff;
  --shadow:0 6px 20px rgba(11,58,91,.09);
  --sky:linear-gradient(180deg,#0b2447 0%,#1a5782 55%,#f08a6c 100%);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1218;--card:#161d26;--ink:#e9eef3;--sub:#9aa8b5;--pri:#8ccbf5;--pri2:#4f9fd6;
  --acc:#ff8a6b;--accbg:#2a1d19;--line:#26313d;--on:#0d1218;
  --shadow:0 6px 20px rgba(0,0,0,.45);
}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.68 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word}

/* ---------- 잠금 화면 ---------- */
.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:var(--sky);position:relative;overflow:hidden}
.gate .skyline{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px)}
.gate-card{position:relative;z-index:1;width:min(340px,100%);padding:28px 24px;border-radius:22px;text-align:center;
  background:rgba(255,255,255,.94);color:#14202b;box-shadow:0 18px 50px rgba(0,0,0,.35);backdrop-filter:blur(8px)}
.gate-card .eyebrow{margin:0;font-size:11px;letter-spacing:.18em;color:#e8512f;font-weight:800}
.gate-card h1{font-size:23px;margin:6px 0 4px;color:#0b3a5b;font-weight:800}
.gate-card p{margin:0 0 18px;font-size:14px;color:#5b6a78}
.gate-card input{width:100%;font-size:16px;padding:13px 14px;border:1px solid #d5dde5;border-radius:12px;background:#fff;color:#14202b}
.gate-card button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;
  background:linear-gradient(135deg,#0b3a5b,#1a6a9c);color:#fff}
.gate-card .err{min-height:20px;margin-top:10px;font-size:14px;color:#c0392b}

/* ---------- 히어로 ---------- */
.hero{position:relative;background:var(--sky);color:#fff;overflow:hidden;padding:34px 20px 128px}
.hero-in{max-width:720px;margin:0 auto;position:relative;z-index:1}
.kicker{margin:0;font-size:12px;letter-spacing:.2em;font-weight:800;opacity:.85}
.hero-title{margin:6px 0 4px;font-size:34px;line-height:1.2;font-weight:800;letter-spacing:-.02em}
.hero-sub{margin:0 0 14px;font-size:15px;opacity:.92}
.chip{display:inline-block;margin:4px 6px 0 0;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px)}
.chip.hot{background:#e8512f;border-color:transparent}
.tags{margin-top:8px}
.tags .chip{font-size:12.5px;font-weight:600;background:rgba(0,0,0,.18);border-color:transparent}
.hero .skyline{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);
  -webkit-mask-image:linear-gradient(to right,transparent,#000 10%,#000 90%,transparent);
  mask-image:linear-gradient(to right,transparent,#000 10%,#000 90%,transparent)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:#06121f}

/* ---------- 본문 ---------- */
.wrap{max-width:720px;margin:0 auto;padding:0 16px 72px}
.tabs{display:flex;gap:6px;position:sticky;top:10px;z-index:5;margin:-24px 0 8px;padding:6px;
  background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow)}
.tabs::before{content:"";position:absolute;left:-16px;right:-16px;top:-10px;height:10px;background:var(--bg);z-index:-1;opacity:0}
.tabs.stuck::before{opacity:1}
.tabs button{flex:1;padding:11px 6px;border:0;border-radius:999px;background:transparent;color:var(--sub);
  font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--on)}
.panel{display:none}.panel.on{display:block}
@media (prefers-reduced-motion:no-preference){
  .panel.on{animation:rise .28s ease}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
.panel>h1{font-size:19px;line-height:1.45;font-weight:800;margin:18px 0 6px;color:var(--ink)}
.panel h2{display:flex;align-items:center;gap:9px;font-size:18px;line-height:1.4;font-weight:800;color:var(--pri);margin:32px 0 12px}
.panel h2::before{content:"";flex:none;width:5px;height:20px;border-radius:3px;background:var(--acc)}
.panel p{margin:10px 0}
.panel strong{color:var(--pri)}
.panel em{font-style:normal;color:var(--sub)}
.panel>ul,.panel>ol{margin:10px 0;padding:14px 18px 14px 36px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.panel li{margin:6px 0}
.panel li>ul,.panel li>ol{margin:4px 0;padding-left:20px}
.panel li li{font-size:15px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 18px 12px;margin:14px 0;box-shadow:var(--shadow)}
.card h3{font-size:16.5px;line-height:1.45;font-weight:800;color:var(--pri);margin:14px 0 8px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.card ul{padding-left:20px;margin:6px 0}

/* 여행 정보 카드 */
.facts{margin:10px 0 4px;padding:4px 18px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.facts>ul{list-style:none;margin:0;padding:0}
.facts>ul>li{margin:0;padding:13px 0;border-bottom:1px dashed var(--line)}
.facts>ul>li:last-child{border-bottom:0}
.facts>ul>li>strong:first-child{display:block;margin-bottom:2px;font-size:12.5px;letter-spacing:.04em;color:var(--acc)}
.facts ul ul{list-style:none;margin:8px 0 0;padding:0}
.facts ul ul li{margin:6px 0;padding:9px 12px;background:var(--bg);border-radius:10px;font-size:15px}

/* 일차 카드 */
.day{margin:18px 0;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.dayhead{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,var(--accbg),transparent 80%)}
.daynum{flex:none;width:58px;height:58px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--on);font-size:24px;font-weight:800;line-height:1}
.daynum small{font-size:10px;letter-spacing:.16em;margin-bottom:3px;opacity:.9}
.daydate{font-size:13px;font-weight:800;color:var(--acc)}
.dayhead h3{margin:2px 0 0;padding:0;border:0;font-size:16.5px;line-height:1.4;font-weight:800;color:var(--ink)}
.day>ul{list-style:none;position:relative;margin:0;padding:16px 16px 4px 34px}
.day>ul::before{content:"";position:absolute;left:23px;top:24px;bottom:30px;width:2px;background:var(--line)}
.day>ul>li{position:relative;margin:0 0 16px}
.day>ul>li::before{content:"";position:absolute;left:-16px;top:7px;width:10px;height:10px;border-radius:50%;
  background:var(--acc);box-shadow:0 0 0 4px var(--card)}
.day>ul>li>strong:first-child{display:block;margin-bottom:3px;font-size:14.5px;color:var(--pri)}
.day ul ul{list-style:disc;margin:3px 0;padding-left:18px;font-size:15px}
.day ul ul li{margin:4px 0}
.day em{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12.5px;line-height:1.7;
  background:var(--accbg);color:var(--acc);font-weight:600}

/* 표 */
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
.tw table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
.tw th,.tw td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tw th{background:var(--bg);color:var(--pri);white-space:nowrap}
.tw tr:last-child td{border-bottom:0}
.tw td:nth-child(2),.tw th:nth-child(2){background:var(--accbg)}
.tw th:nth-child(2){color:var(--acc)}

.foot{margin:36px 0 0;text-align:center;font-size:12.5px;color:var(--sub)}
#top{position:fixed;right:16px;bottom:20px;width:46px;height:46px;border:0;border-radius:50%;font-size:11px;font-weight:800;
  background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--on);box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .2s;cursor:pointer}
#top.show{opacity:1;pointer-events:auto}

@media print{.hero{padding-bottom:24px}.hero .skyline,.tabs,#top{display:none}.panel{display:block!important}
  .day,.card,.facts,.tw{box-shadow:none;break-inside:avoid}}
</style>
</head>

function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}

function initUi(){
  var bs=document.querySelectorAll('.tabs button');
  bs.forEach(function(b){
    b.addEventListener('click',function(){
      bs.forEach(function(x){x.classList.remove('on');x.setAttribute('aria-selected','false')});
      document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');b.setAttribute('aria-selected','true');
      document.getElementById('tab-'+b.dataset.tab).classList.add('on');
      var h=document.querySelector('.hero');
      window.scrollTo(0,h?h.offsetHeight-60:0);
    });
  });
  var el=document.getElementById('dday');
  if(el){
    var s=new Date(el.dataset.start+'T00:00:00+09:00'),e=new Date(el.dataset.end+'T23:59:59+09:00'),n=new Date();
    var d=Math.ceil((s-n)/864e5);
    el.textContent=d>0?'D-'+d:(n<=e?'여행 중':'다녀온 여행');
  }
  var top=document.getElementById('top'),tb=document.querySelector('.tabs');
  function onScroll(){
    if(top)top.classList.toggle('show',window.scrollY>500);
    if(tb)tb.classList.toggle('stuck',tb.getBoundingClientRect().top<=11);
  }
  window.addEventListener('scroll',onScroll);onScroll();
  if(top)top.addEventListener('click',function(){window.scrollTo(0,0)});
}

async function openIt(pw){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:IT,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  return new TextDecoder().decode(pt);
}
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var err=document.getElementById('err');err.textContent='';
  try{
    var html=await openIt(document.getElementById('pw').value);
    document.getElementById('app').innerHTML=html;initUi();window.scrollTo(0,0);
  }catch(x){err.textContent='비밀번호가 맞지 않습니다';}
});
</script>
