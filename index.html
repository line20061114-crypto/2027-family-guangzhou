<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>광저우 가족여행 2027</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#1f2933;--sub:#5b6770;--navy:#1e2761;--coral:#b7472a;--line:#e3ded3}
@media (prefers-color-scheme:dark){:root{--bg:#14161c;--card:#1d2029;--ink:#e8eaee;--sub:#a3abb5;--navy:#9db0ff;--coral:#ff8a6b;--line:#2c313d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
#app{max-width:680px;margin:0 auto;padding:0 16px 48px}
.gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
.gate h1{font-size:22px;margin:0 0 4px;color:var(--navy)}
.gate p{color:var(--sub);margin:0 0 20px;font-size:14px}
.gate input{width:min(280px,100%);font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.gate button{margin-top:12px;width:min(280px,100%);padding:12px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:16px}
@media (prefers-color-scheme:dark){.gate button{color:#14161c}}
.gate .err{color:var(--coral);min-height:20px;margin-top:10px;font-size:14px}
.hero{padding:28px 0 12px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.14em;color:var(--coral);font-weight:700}
.hero h1{margin:4px 0 2px;font-size:28px;color:var(--navy)}
.dates{margin:0;font-weight:700}
.sub{margin:2px 0 10px;color:var(--sub);font-size:14px}
.note{margin:0;padding:10px 12px;background:var(--card);border-left:3px solid var(--coral);border-radius:6px;font-size:13px;color:var(--sub)}
.tabs{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:14px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (prefers-color-scheme:dark){.tabs button.on{color:#14161c}}
.panel{display:none}.panel.on{display:block}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:0 14px}
.day summary{cursor:pointer;padding:14px 0;font-weight:700;list-style:none}
.day summary::-webkit-details-marker{display:none}
.d{display:inline-block;margin-right:8px;padding:1px 8px;border-radius:6px;background:var(--navy);color:#fff;font-size:12px}
@media (prefers-color-scheme:dark){.d{color:#14161c}}
.day ul{margin:0 0 8px;padding-left:18px}
.day li{margin:6px 0}
.tags{margin:0 0 14px;font-size:13px;color:var(--coral)}
h2{font-size:17px;color:var(--navy);margin:20px 0 8px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:15px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
.tbd{color:var(--sub);font-style:italic}
.check{list-style:none;padding:0;margin:0}
.check li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px}
</style>
</head>
<body>

<form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" autofocus><br><button type="submit">열기</button></form>
<div class="err" id="err"></div></div></div>

function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}

function bindTabs(){
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('on')});
      document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');
      document.getElementById('tab-'+b.dataset.tab).classList.add('on');
      window.scrollTo(0,0);
    });
  });
}

async function open(pw){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:IT,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  return new TextDecoder().decode(pt);
}
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var err=document.getElementById('err');err.textContent='';
  try{
    var html=await open(document.getElementById('pw').value);
    document.getElementById('app').innerHTML=html;bindTabs();window.scrollTo(0,0);
  }catch(x){err.textContent='비밀번호가 맞지 않습니다';}
});
</script>
