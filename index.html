<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>광저우 가족여행 2027</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#1f2933;--sub:#5b6770;--navy:#1e2761;--coral:#b7472a;--line:#e3ded3;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#14161c;--card:#1d2029;--ink:#e8eaee;--sub:#a3abb5;--navy:#9db0ff;--coral:#ff8a6b;--line:#2c313d;--on:#14161c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:720px;margin:0 auto;padding:0 16px 56px}
.gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
.gate h1{font-size:22px;margin:0 0 4px;color:var(--navy)}
.gate p{color:var(--sub);margin:0 0 20px;font-size:14px}
.gate input{width:min(280px,100%);font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.gate button{margin-top:12px;width:min(280px,100%);padding:12px;border:0;border-radius:10px;background:var(--navy);color:var(--on);font-size:16px}
.gate .err{color:var(--coral);min-height:20px;margin-top:10px;font-size:14px}
.tabs{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:2}
.tabs button{flex:1;padding:11px 6px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:15px;font-weight:600}
.tabs button.on{background:var(--navy);color:var(--on);border-color:var(--navy)}
.panel{display:none}.panel.on{display:block}
.panel h1{font-size:23px;line-height:1.35;color:var(--navy);margin:14px 0 8px;word-break:keep-all}
.panel h2{font-size:18px;line-height:1.4;color:var(--navy);margin:28px 0 10px;padding-top:6px;border-top:2px solid var(--coral);word-break:keep-all}
.panel h3{font-size:16.5px;line-height:1.4;margin:22px 0 8px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--coral);border-radius:8px;color:var(--ink);word-break:keep-all}
.panel p{margin:10px 0}
.panel ul,.panel ol{padding-left:22px;margin:8px 0}
.panel li{margin:5px 0}
.panel li>ul{margin:4px 0}
.panel strong{color:var(--navy)}
.panel hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.panel blockquote{margin:12px 0;padding:8px 14px;border-left:3px solid var(--coral);background:var(--card);border-radius:6px;color:var(--sub)}
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.tw table{border-collapse:collapse;width:100%;min-width:540px;font-size:14px}
.tw th,.tw td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tw th{background:var(--bg);color:var(--navy);white-space:nowrap}
.tw tr:last-child td{border-bottom:0}
</style>
</head>

function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}

function bindTabs(){
  var bs=document.querySelectorAll('.tabs button');
  bs.forEach(function(b){
    b.addEventListener('click',function(){
      bs.forEach(function(x){x.classList.remove('on')});
      document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');
      document.getElementById('tab-'+b.dataset.tab).classList.add('on');
      window.scrollTo(0,0);
    });
  });
}

async function openIt(pw){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:IT,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  return new TextDecoder().decode(pt);
}
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var err=document.getElementById('err');err.textContent='';
  try{
    var html=await openIt(document.getElementById('pw').value);
    document.getElementById('app').innerHTML=html;bindTabs();window.scrollTo(0,0);
  }catch(x){err.textContent='비밀번호가 맞지 않습니다';}
});
